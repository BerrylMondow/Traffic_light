<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <span class="title"><h1>Traffic Light</h1></span>

        <div class="traffic-light">
            <div class="light-red" id="red-light"></div>
            <div class="light-yellow" id="yellow-light"></div>
            <div class="light-green" id="green-light"></div>
        </div>

        <div class="buttons">
            <button class="button" id="red-button">Red</button>
            <button class="button" id="yellow-button">Yellow</button>
            <button class="button" id="green-button">Green</button>
            <button class="button" id="all-button">Turn On All</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
